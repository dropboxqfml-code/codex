name: Publish 6517A trial download

on:
  push:
    tags:
      - '6517a-v*'
    branches:
      - '6517a-debug-*'

permissions:
  contents: read

concurrency:
  group: 6517a-release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUTF8: '1'
  QT_QPA_PLATFORM: offscreen

jobs:
  windows-package:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        working-directory: 6517a
    outputs:
      version: ${{ steps.version.outputs.version }}
      source_commit: ${{ steps.version.outputs.source_commit }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.13.5'
      - name: Install locked Windows tools
        run: uv sync --locked --python 3.12.14
      - name: Verify release tag and source version
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
        run: |
          @'
          import os
          import re
          import subprocess
          import tomllib
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version']
          ref_type = os.environ['RELEASE_REF_TYPE']
          ref_name = os.environ['RELEASE_TAG']
          if ref_type == 'tag':
              if not re.fullmatch(r'\d+\.\d+\.\d+', version):
                  raise SystemExit('Release version must be a plain numeric semantic version')
              if ref_name != f'6517a-v{version}':
                  raise SystemExit('Release tag does not match the package version')
          elif ref_type != 'branch' or not ref_name.startswith('6517a-debug-'):
              raise SystemExit('Only release tags or explicit debug branches are supported')
          if not isinstance(version, str) or not version or '\n' in version or '\r' in version:
              raise SystemExit('Invalid version output')
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'version={version}\nsource_commit={commit}\n')
          '@ | uv run --locked python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run Windows software checks
        id: software_checks
        run: |
          uv run --locked pytest -q --junitxml=reports/windows-tests.xml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --locked ruff check .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --locked ruff format --check .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Show failing Windows test cases in annotations
        if: failure() && steps.software_checks.outcome == 'failure'
        run: |
          @'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          def emit(message):
              original = str(message).encode('utf-8')
              limit = 5000
              prefix = '::error title=Windows software check failure::'
              while True:
                  if len(original) <= limit:
                      body = original.decode('utf-8', errors='ignore')
                  else:
                      head = original[:limit * 3 // 4].decode('utf-8', errors='ignore')
                      tail = original[-limit // 4:].decode('utf-8', errors='ignore')
                      body = head + '\n...[traceback truncated]...\n' + tail
                  escaped = body.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  line = prefix + escaped
                  if len(line.encode('utf-8')) <= 6000:
                      print(line)
                      return
                  limit = max(100, limit * 4 // 5)
          report = Path('reports/windows-tests.xml')
          if not report.is_file():
              emit('Windows checks failed before a JUnit report was written: ' + str(report))
          else:
              try:
                  root = ET.parse(report).getroot()
              except (OSError, ET.ParseError) as exc:
                  emit('Cannot read the failing Windows JUnit report: ' + str(exc))
              else:
                  count = 0
                  for case in root.iter('testcase'):
                      for result in case:
                          if result.tag not in ('failure', 'error'):
                              continue
                          name = case.get('classname', '') + '.' + case.get('name', '')
                          detail = result.get('message', '') + '\n' + ''.join(result.itertext())
                          emit(name + ' [' + result.tag + ']\n' + detail)
                          count += 1
                  if not count:
                      emit('Windows software checks failed, but JUnit has no failing/error test case. Check Ruff or later check output.')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and test the bundled Windows interpreter, synthetic CLI and GUI
        if: github.ref_type == 'tag'
        run: |
          uv run --locked python scripts/build_trial_bundle.py --output dist --native-smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item reports/windows-tests.xml dist/Windows-software-tests.xml
      - name: Retain Windows test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: 6517A-Windows-test-results-${{ github.run_id }}
          path: 6517a/reports/windows-tests.xml
          if-no-files-found: warn
      - name: Transfer tested release files
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v6
        with:
          name: 6517A-release-files-${{ github.run_id }}
          path: 6517a/dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: windows-package
    if: github.ref_type == 'tag' && needs.windows-package.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_VERSION: ${{ needs.windows-package.outputs.version }}
      SOURCE_COMMIT: ${{ needs.windows-package.outputs.source_commit }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: 6517A-release-files-${{ github.run_id }}
          path: release-files
      - name: Verify checksums, native test result and unchanged remote tag
        working-directory: release-files
        run: |
          stem="6517A-USB-GPIB-Trial-${RELEASE_VERSION}"
          sha256sum --check "${stem}-Windows-x64.zip.sha256"
          sha256sum --check "${stem}-Source.zip.sha256"
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path
          version = os.environ['RELEASE_VERSION']
          if os.environ['RELEASE_TAG'] != f'6517a-v{version}':
              raise SystemExit('Release tag/version mismatch')
          report = json.loads(Path(f'6517A-USB-GPIB-Trial-{version}-build-report.json').read_text(encoding='utf-8'))
          if report.get('version') != version or report.get('native_windows_execution_verified') is not True:
              raise SystemExit('Native Windows smoke test was not confirmed')
          if report.get('hardware_verified') is not False:
              raise SystemExit('This workflow cannot verify physical hardware')
          if report.get('relocated_windows_execution_verified') is not True:
              raise SystemExit('Relocated Windows bundle verification was not confirmed')
          if report.get('relocation_check', {}).get('checks', {}).get('reference_1gohm_simulation_verified') is not True:
              raise SystemExit('Bundled 1 Gohm reference simulation was not confirmed')
          if report.get('relocation_check', {}).get('checks', {}).get('analysis_text_export_verified') is not True:
              raise SystemExit('Bundled analysis text export was not confirmed')
          if report.get('relocation_check', {}).get('checks', {}).get('saved_result_review_verified') is not True:
              raise SystemExit('Bundled offline saved-result review was not confirmed')
          if report.get('relocation_check', {}).get('checks', {}).get('user_stop_classification_verified') is not True:
              raise SystemExit('Bundled user STOP classification was not confirmed')
          if report.get('relocation_check', {}).get('checks', {}).get('automatic_startup_checks_verified') is not True:
              raise SystemExit('Bundled automatic startup checks were not confirmed')
          if report.get('relocation_check', {}).get('checks', {}).get('graph_order_verified') is not True:
              raise SystemExit('Bundled resistance-first graph order was not confirmed')
          if report.get('relocation_check', {}).get('checks', {}).get('sample_geometry_resistivity_verified') is not True:
              raise SystemExit('Bundled sample dimensions and resistivity conversion were not confirmed')
          if report.get('relocation_check', {}).get('checks', {}).get('adaptive_resistivity_analysis_verified') is not True:
              raise SystemExit('Bundled four/five-column text and offline resistivity analysis were not confirmed')
          if report.get('relocation_check', {}).get('checks', {}).get('analysis_comparison_session_verified') is not True:
              raise SystemExit('Bundled multiple-result comparison and analysis session restore were not confirmed')
          if report.get('relocation_check', {}).get('checks', {}).get('estimated_progress_verified') is not True:
              raise SystemExit('Bundled estimated remaining-time display was not confirmed')
          if report.get('relocation_check', {}).get('checks', {}).get('diagnostic_zip_export_verified') is not True:
              raise SystemExit('Bundled local diagnostic ZIP export was not confirmed')
          if report.get('relocation_check', {}).get('checks', {}).get('zero_correction_compatibility_verified') is not True:
              raise SystemExit('Bundled front-panel zero correction and ARM failure records were not confirmed')
          if report.get('relocation_check', {}).get('checks', {}).get('device_ascii_compatibility_verified') is not True:
              raise SystemExit('Bundled device ASCII suffix compatibility and saved values were not confirmed')
          repo = os.environ['GITHUB_REPOSITORY']
          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', path], text=True))
          target = api(f'repos/{repo}/git/ref/tags/{os.environ["RELEASE_TAG"]}')['object']
          for _ in range(4):
              if target['type'] != 'tag':
                  break
              target = api(f'repos/{repo}/git/tags/{target["sha"]}')['object']
          if target['type'] != 'commit' or target['sha'] != os.environ['SOURCE_COMMIT']:
              raise SystemExit('Remote release tag changed after the tests')
          PY
      - name: Publish immutable trial assets as a prerelease
        working-directory: release-files
        run: |
          stem="6517A-USB-GPIB-Trial-${RELEASE_VERSION}"
          notes="${RUNNER_TEMP}/6517a-release-notes.md"
          cat > "$notes" <<'NOTES'
          6517A · NI GPIB-USB v0.9.3 자동 범위 비교 진단 시험판입니다. Windows 64비트 ZIP에는 Python과 Python 의존성이 포함됩니다.

          자동 전류 범위의 검색 하한·상한을 설정·조회 검증하고 선택한 하한에서 영점 보정합니다. 고급 설정의 'nA 범위 비교 진단값'은 AUTO 2 nA~200 nA, 0/0.1/0.5 V·각 30초를 준비합니다. 기존 더 낮은 전압 상한·trip은 높이지 않으며 사용자 확인도 자동 승인하지 않습니다.

          장비의 B8 교정 이상 비트를 감지하면 정상 측정을 차단합니다. 명시적으로 선택한 저전압 비교 진단은 1 V 이하에서 수치를 보존하되, 화면·CSV·metadata에 진단용임을 표시하고 정상 요약 및 저장 결과 분석 통계에서 제외합니다. analysis.txt의 시간·저항·[비저항]·전압·전류 데이터 전용 형식은 유지합니다.

          이 기능은 장비의 교정 데이터를 복구하지 않습니다. 장비가 200 pA 범위에서 약 158 pA를 반환한 사례에 대해 낮은 pA 범위를 회피해 비교할 수 있도록 준비한 시험판이며, 실제 장비에서 현상 해소와 측정 정확도는 확인이 필요합니다. 새 +513 오류, OVERFLOW, software trip 정지는 유지합니다. Software trip은 장비 보고 전류에 의존하며 독립 하드웨어 보호 검증이 아닙니다.

          Check-Output-Off.cmd는 모델 식별·출력 OFF 확인 후 교정 상태와 실제 AUTO·범위·검색 한도를 읽어 기록합니다. 진단 수집 성공은 장비 교정 또는 정확도 합격을 뜻하지 않습니다.

          새 폴더에 압축을 모두 풀고 Start-GUI.cmd를 실행하세요. Bundle → Simulation 검사 후 GUI를 자동 실행합니다. 호환되는 NI-488.2·NI-VISA 64비트가 필요합니다. 실제 장비 시험 전에 NI MAX test panel을 닫으세요.

          Windows 전체 소프트웨어 시험·번들 실행·이동 경로 검증 결과는 Windows-software-tests.xml과 build-report.json에 포함됩니다. 실제 장비는 CI에 연결되지 않았습니다. v1.0.0 정식 배포 전 사용자 비교 시험용 버전입니다.
          NOTES
          assets=(
            "${stem}-Windows-x64.zip"
            "${stem}-Windows-x64.zip.sha256"
            "${stem}-Source.zip"
            "${stem}-Source.zip.sha256"
            "${stem}-build-report.json"
            "Windows-software-tests.xml"
          )
          for asset in "${assets[@]}"; do test -s "$asset"; done
          gh release create "$RELEASE_TAG" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft --prerelease --latest=false \
            --title "6517A USB-GPIB Trial ${RELEASE_VERSION}" --notes-file "$notes"
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --draft=false --prerelease --latest=false
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json url,assets
