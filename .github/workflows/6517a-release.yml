name: Publish 6517A trial download

on:
  push:
    tags:
      - '6517a-v*'
    branches:
      - '6517a-debug-*'

permissions:
  contents: read

concurrency:
  group: 6517a-release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUTF8: '1'
  QT_QPA_PLATFORM: offscreen

jobs:
  windows-package:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        working-directory: 6517a
    outputs:
      version: ${{ steps.version.outputs.version }}
      source_commit: ${{ steps.version.outputs.source_commit }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.13.5'
      - name: Install locked Windows tools
        run: uv sync --locked --python 3.12.14
      - name: Verify release tag and source version
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
        run: |
          @'
          import os
          import re
          import subprocess
          import tomllib
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version']
          ref_type = os.environ['RELEASE_REF_TYPE']
          ref_name = os.environ['RELEASE_TAG']
          if ref_type == 'tag':
              if not re.fullmatch(r'\d+\.\d+\.\d+', version):
                  raise SystemExit('Release version must be a plain numeric semantic version')
              if ref_name != f'6517a-v{version}':
                  raise SystemExit('Release tag does not match the package version')
          elif ref_type != 'branch' or not ref_name.startswith('6517a-debug-'):
              raise SystemExit('Only release tags or explicit debug branches are supported')
          if not isinstance(version, str) or not version or '\n' in version or '\r' in version:
              raise SystemExit('Invalid version output')
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'version={version}\nsource_commit={commit}\n')
          '@ | uv run --locked python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run Windows software checks
        id: software_checks
        run: |
          uv run --locked pytest -q --junitxml=reports/windows-tests.xml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --locked ruff check .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --locked ruff format --check .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Show failing Windows test cases in annotations
        if: failure() && steps.software_checks.outcome == 'failure'
        run: |
          @'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          def emit(message):
              original = str(message).encode('utf-8')
              limit = 5000
              prefix = '::error title=Windows software check failure::'
              while True:
                  if len(original) <= limit:
                      body = original.decode('utf-8', errors='ignore')
                  else:
                      head = original[:limit * 3 // 4].decode('utf-8', errors='ignore')
                      tail = original[-limit // 4:].decode('utf-8', errors='ignore')
                      body = head + '\n...[traceback truncated]...\n' + tail
                  escaped = body.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  line = prefix + escaped
                  if len(line.encode('utf-8')) <= 6000:
                      print(line)
                      return
                  limit = max(100, limit * 4 // 5)
          report = Path('reports/windows-tests.xml')
          if not report.is_file():
              emit('Windows checks failed before a JUnit report was written: ' + str(report))
          else:
              try:
                  root = ET.parse(report).getroot()
              except (OSError, ET.ParseError) as exc:
                  emit('Cannot read the failing Windows JUnit report: ' + str(exc))
              else:
                  count = 0
                  for case in root.iter('testcase'):
                      for result in case:
                          if result.tag not in ('failure', 'error'):
                              continue
                          name = case.get('classname', '') + '.' + case.get('name', '')
                          detail = result.get('message', '') + '\n' + ''.join(result.itertext())
                          emit(name + ' [' + result.tag + ']\n' + detail)
                          count += 1
                  if not count:
                      emit('Windows software checks failed, but JUnit has no failing/error test case. Check Ruff or later check output.')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and test the bundled Windows interpreter, synthetic CLI and GUI
        if: github.ref_type == 'tag'
        run: |
          uv run --locked python scripts/build_trial_bundle.py --output dist --native-smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item reports/windows-tests.xml dist/Windows-software-tests.xml
      - name: Retain Windows test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: 6517A-Windows-test-results-${{ github.run_id }}
          path: 6517a/reports/windows-tests.xml
          if-no-files-found: warn
      - name: Transfer tested release files
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v6
        with:
          name: 6517A-release-files-${{ github.run_id }}
          path: 6517a/dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: windows-package
    if: github.ref_type == 'tag' && needs.windows-package.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_VERSION: ${{ needs.windows-package.outputs.version }}
      SOURCE_COMMIT: ${{ needs.windows-package.outputs.source_commit }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: 6517A-release-files-${{ github.run_id }}
          path: release-files
      - name: Verify checksums, native test result and unchanged remote tag
        working-directory: release-files
        run: |
          stem="6517A-USB-GPIB-Trial-${RELEASE_VERSION}"
          sha256sum --check "${stem}-Windows-x64.zip.sha256"
          sha256sum --check "${stem}-Source.zip.sha256"
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path
          version = os.environ['RELEASE_VERSION']
          if os.environ['RELEASE_TAG'] != f'6517a-v{version}':
              raise SystemExit('Release tag/version mismatch')
          report = json.loads(Path(f'6517A-USB-GPIB-Trial-{version}-build-report.json').read_text(encoding='utf-8'))
          if report.get('version') != version or report.get('native_windows_execution_verified') is not True:
              raise SystemExit('Native Windows smoke test was not confirmed')
          if report.get('hardware_verified') is not False:
              raise SystemExit('This workflow cannot verify physical hardware')
          if report.get('relocated_windows_execution_verified') is not True:
              raise SystemExit('Relocated Windows bundle verification was not confirmed')
          if report.get('relocation_check', {}).get('checks', {}).get('reference_1gohm_simulation_verified') is not True:
              raise SystemExit('Bundled 1 Gohm reference simulation was not confirmed')
          if report.get('relocation_check', {}).get('checks', {}).get('analysis_text_export_verified') is not True:
              raise SystemExit('Bundled four-column analysis text export was not confirmed')
          if report.get('relocation_check', {}).get('checks', {}).get('saved_result_review_verified') is not True:
              raise SystemExit('Bundled offline saved-result review was not confirmed')
          if report.get('relocation_check', {}).get('checks', {}).get('user_stop_classification_verified') is not True:
              raise SystemExit('Bundled user STOP classification was not confirmed')
          repo = os.environ['GITHUB_REPOSITORY']
          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', path], text=True))
          target = api(f'repos/{repo}/git/ref/tags/{os.environ["RELEASE_TAG"]}')['object']
          for _ in range(4):
              if target['type'] != 'tag':
                  break
              target = api(f'repos/{repo}/git/tags/{target["sha"]}')['object']
          if target['type'] != 'commit' or target['sha'] != os.environ['SOURCE_COMMIT']:
              raise SystemExit('Remote release tag changed after the tests')
          PY
      - name: Publish immutable trial assets as a prerelease
        working-directory: release-files
        run: |
          stem="6517A-USB-GPIB-Trial-${RELEASE_VERSION}"
          notes="${RUNNER_TEMP}/6517a-release-notes.md"
          cat > "$notes" <<'NOTES'
          6517A · NI GPIB-USB 시험용 프로그램입니다. Windows 64비트 ZIP에는 Python과 Python 의존성이 포함되어 있습니다.

          정상 완료·사용자 STOP·실제 오류를 구분하고 저장 행 수와 경과 시간을 표시합니다. START 전 STOP도 전압을 인가하지 않고 준비를 취소합니다. 출력 종료 처리·저장 오류는 오류 종료로 기록합니다.
          '저장 결과 분석'에서 이전 readings.csv를 장비 연결 없이 열고, 시작·끝 시간을 지정해 전류·저항 그래프와 평균·표본 표준편차를 확인할 수 있습니다.
          '선택 구간 TXT 저장'은 해당 시간 구간의 데이터만 네 열로 저장합니다. 원본 파일과 기존 파일은 덮어쓰지 않습니다. 결과 분석은 별도 창에서 수행합니다.

          측정 결과 폴더에 analysis.txt를 자동 저장합니다. 첫 행은 Time (s), Resistance (Ohm), Voltage (V), Current (A)이며 탭으로 구분합니다. 이후에는 SI 단위 데이터 네 열만 기록합니다.
          모든 판독을 포함하며 STOP 전에 취득한 데이터도 남습니다. 값이 없는 항목은 nan으로 표시하고, 전압은 소스 설정 readback·전류는 원시 측정값·저항은 native 또는 V/I 계산값을 사용합니다.
          이전 readings.csv는 Run-CLI.cmd export-analysis "경로\readings.csv"로 변환할 수 있습니다. 기존 파일은 덮어쓰지 않습니다.

          Test-Simulation.cmd의 중간 처리 표시, ARM·START 대기 이유와 간소화된 기본 화면을 제공합니다. 고급 설정과 진단·로그는 별도 탭에 있습니다.
          '1. 시험 설정'에서 '1 GΩ · 1 V 시험값 적용'으로 1 V·10 nA trip을 준비하고 사용자 확인·잔류 전압 확인·resistive-limit 정책을 선택합니다. '측정 설정 적용'은 필수값을 검사하고, '초안 적용'은 미완료 설정을 보존합니다.
          화면의 1 설정 → 2 연결 → 3 ARM → 4 START를 따릅니다. ARM이 비활성화되면 진행 안내에서 누락 설정이나 장비 조건을 확인하세요. 출력 OFF에서 '연결 종료 후 설정 수정'으로 돌아갈 수 있습니다.
          사용자 관리 모드는 최대 10 V·source 100 V 범위를 유지합니다. 설정·연결·ARM만으로 출력 ON을 하지 않으며 START는 별도 동작입니다.

          압축을 모두 풀고 Verify-Bundle.cmd → Test-Simulation.cmd → Start-GUI.cmd 순서로 실행하세요.
          Verify-Bundle.cmd는 START → CHECK 처리 파일 수 → PASS/FAIL을 표시하고 diagnostics/bundle-verification-*.json에 결과를 저장합니다.
          Test-Simulation.cmd는 사전검사 → 연결 → ARM → START → 전압 단계·판독 → 요약 → OFF → PASS/FAIL과 결과 경로를 실행 중 표시합니다.
          재생성되는 Python 캐시는 배포 파일에서 제외하며, 새 위치에 압축을 풀고 CLI/GUI 실행·캐시 재생성 후에도 파일 검사를 통과하는지 확인합니다. 새 폴더에 압축을 풀어 사용하세요.
          NI MAX에서 보이는 장비와 같은 주소를 사용합니다. IDN·보호 OFF가 필요하면 '진단·상세 기록' 탭을 사용하세요.
          기본 경로에는 해당 모델과 호환되는 NI-488.2 및 NI-VISA 64비트가 필요합니다.
          NI-VISA를 생략하는 @py 시험 기능은 Enable-NI-Only.cmd로 선택 확장을 별도 설치한 경우에만 사용할 수 있으며, NI-488.2 드라이버는 여전히 필요합니다. 기본 ZIP은 이 확장을 포함하거나 자동 설치하지 않습니다.

          이 배포는 Windows 전체 소프트웨어 시험과 번들 Windows 인터프리터의 가상 CLI/GUI 및 선택 확장 설치 smoke를 통과한 뒤 생성했습니다. 권한이 없는 Windows 심볼릭 링크 시험은 test report에 skipped로 구분됩니다.
          사용자 PC의 IDN·보호 OFF 확인은 보고됐으며, 이번 버전의 실제 전압 인가·전류 취득·하드웨어 차단·방전 시험은 미수행입니다. 출력 OFF는 방전 완료를 뜻하지 않으며 실장비 native 저항 모드는 차단되어 있습니다.

          자세한 실행 절차와 검증 범위는 ZIP 안의 READ_FIRST_KO.txt 및 app/docs를 확인하세요. Windows-software-tests.xml과 build-report.json은 이 CI 실행의 결과입니다.
          NOTES
          assets=(
            "${stem}-Windows-x64.zip"
            "${stem}-Windows-x64.zip.sha256"
            "${stem}-Source.zip"
            "${stem}-Source.zip.sha256"
            "${stem}-build-report.json"
            "Windows-software-tests.xml"
          )
          for asset in "${assets[@]}"; do test -s "$asset"; done
          gh release create "$RELEASE_TAG" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft --prerelease --latest=false \
            --title "6517A USB-GPIB Trial ${RELEASE_VERSION}" --notes-file "$notes"
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --draft=false --prerelease --latest=false
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json url,assets
