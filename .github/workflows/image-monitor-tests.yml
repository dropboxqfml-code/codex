name: Image Monitor Windows checks

on:
  push:
    branches: [artifacts/image-monitor-native-probe-20261114]
    paths:
      - image-monitor/**
      - .github/workflows/image-monitor-tests.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-monitor-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-tests:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      IMAGE_MONITOR_ALLOW_PATH_TESTS: '1'
      PYTHONUTF8: '1'
    defaults:
      run:
        shell: pwsh
        working-directory: image-monitor
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.13.8'
          enable-cache: true
          cache-dependency-glob: image-monitor/uv.lock
      - name: Prepare managed Python and locked Windows dependencies
        run: |
          uv python install 3.12.14
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv sync --locked --extra windows --python 3.12.14 --managed-python
      - name: Lint and format
        run: |
          .venv/Scripts/ruff.exe check .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv/Scripts/ruff.exe format --check .
      - name: Verify Chrome focus recovery and native saving
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          New-Item -ItemType Directory -Force reports | Out-Null
          .venv/Scripts/python.exe -m pytest -q --maxfail=1 --tb=short tests/test_windows_automatic_post.py tests/test_windows_completion_focus.py tests/test_windows_auto_session.py tests/test_monitor_setup_retry_integration.py *> reports/windows-focus.txt
          $pytestExit = $LASTEXITCODE
          $output = Get-Content -Raw -LiteralPath reports/windows-focus.txt
          Write-Host $output
          if ($pytestExit -ne 0) {
            $escaped = $output.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error title=Windows native focus failure::$escaped"
          }
          exit $pytestExit
      - name: Run unit tests and real CMD lookup regression checks
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          New-Item -ItemType Directory -Force reports | Out-Null
          .venv/Scripts/python.exe -m pytest -q --maxfail=1 --junitxml=reports/windows-pytest.xml *> reports/pytest-output.txt
          $pytestExit = $LASTEXITCODE
          Get-Content -LiteralPath reports/pytest-output.txt
          $annotations = 0
          try {
            if (Test-Path -LiteralPath reports/windows-pytest.xml) {
              [xml]$junit = Get-Content -Raw -LiteralPath reports/windows-pytest.xml
              $totals = @{ tests = 0; failures = 0; errors = 0; skipped = 0 }
              foreach ($suite in $junit.SelectNodes('//testsuite')) {
                foreach ($key in @('tests', 'failures', 'errors', 'skipped')) {
                  $totals[$key] += [int]$suite.GetAttribute($key)
                }
              }
              Write-Host "::notice title=Windows test summary::tests=$($totals.tests), failures=$($totals.failures), errors=$($totals.errors), skipped=$($totals.skipped)"
              foreach ($testcase in $junit.SelectNodes('//testcase[failure or error]')) {
                foreach ($detail in $testcase.SelectNodes('failure | error')) {
                  $name = $testcase.GetAttribute('classname') + '.' + $testcase.GetAttribute('name')
                  $message = $name + "`n" + $detail.GetAttribute('message') + "`n" + $detail.InnerText
                  $escaped = $message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
                  Write-Host "::error title=Windows test failure::$escaped"
                  $annotations += 1
                }
              }
            }
          } catch {
            Write-Host '::warning::Could not parse the current JUnit report; see captured pytest output.'
          }
          if ($pytestExit -ne 0 -and $annotations -eq 0) {
            $message = Get-Content -Raw -LiteralPath reports/pytest-output.txt
            $escaped = $message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error title=Windows test failure::$escaped"
          }
          exit $pytestExit
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ImageMonitor-Windows-test-results-${{ github.run_number }}
          path: |
            image-monitor/reports/windows-pytest.xml
            image-monitor/reports/pytest-output.txt
            image-monitor/reports/windows-focus.txt
          if-no-files-found: warn
          retention-days: 14
