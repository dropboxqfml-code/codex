name: Offline privacy regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.23'
      - name: Prepare Qt and tracing tools (build-time network only)
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libopengl0 libxkbcommon0 libdbus-1-3 libseccomp2 strace
          uv sync --locked
      - name: Run GUI flow with native IPv4 and IPv6 sockets denied
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          mkdir -p reports
          strace -f -e trace=network,process -o reports/offline-syscalls.log .venv/bin/python scripts/offline_probe.py
          .venv/bin/python scripts/check_network_trace.py reports/offline-syscalls.log
      - name: Upload synthetic-data privacy evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Offline-privacy-evidence-${{ github.run_number }}
          path: |
            reports/offline-probe.json
            reports/offline-functional.json
            reports/offline-functional.png
            reports/offline-syscalls.log
          retention-days: 30
          if-no-files-found: error
