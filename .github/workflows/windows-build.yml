name: Windows executable

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-executable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and package Windows x64
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Python 3.12 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.23'
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Lint
        run: |
          uv run --locked ruff check .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --locked ruff format --check .

      - name: Run tests before building
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run --locked pytest -q --junitxml=reports/pytest.xml

      - name: Build Windows executable
        run: uv run --locked python scripts/build_windows.py

      - name: Test frozen executable with native Windows Qt and Recycle Bin
        run: uv run --locked python scripts/verify_windows_build.py

      - name: Upload runnable Windows bundle
        uses: actions/upload-artifact@v4
        with:
          name: ImageDuplicateFinder-Windows-x64-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Upload test reports and build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-build-reports-${{ github.run_number }}
          path: |
            reports/
            build/**/warn-*.txt
          if-no-files-found: warn
          retention-days: 30
