name: Windows executable

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-executable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and package Windows x64
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.23'
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install managed CPython 3.12 and reject vulnerable SQLite
        run: |
          uv python install 3.12.14
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $idfPythonPath = uv python find --managed-python 3.12.14
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "UV_PYTHON=$idfPythonPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $idfPythonPath -c "import sqlite3; print('Managed SQLite:', sqlite3.sqlite_version); assert sqlite3.sqlite_version_info >= (3, 50, 2), 'CVE-2025-6965 requires newer SQLite'"

      - name: Install locked dependencies
        run: uv sync --locked --group security

      - name: Audit all locked dependency versions (build-time network only)
        run: uv run --locked --group security python scripts/audit_dependencies.py

      - name: Lint
        run: |
          uv run --locked ruff check .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --locked ruff format --check .

      - name: Run tests before building
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run --locked pytest -q --junitxml=reports/pytest.xml

      - name: Build Windows executable
        run: uv run --locked python scripts/build_windows.py

      - name: Test frozen executable with native Windows Qt and Recycle Bin
        run: uv run --locked python scripts/verify_windows_build.py

      - name: Upload runnable Windows bundle
        uses: actions/upload-artifact@v6
        with:
          name: ImageDuplicateFinder-Windows-x64-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Upload test reports and build diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Windows-build-reports-${{ github.run_number }}
          path: |
            reports/pytest.xml
            reports/frozen-smoke.json
            reports/frozen-smoke.png
            reports/dependency-audit.json
            reports/audit-requirements.txt
            reports/bundle-inventory.json
            reports/pyinstaller.log
            build/**/warn-*.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Summarize test and packaged executable results
        if: always()
        run: python scripts/summarize_windows_build.py
