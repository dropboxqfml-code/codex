[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "image-monitor"
dynamic = ["version"]
description = "Windows image monitor with browser-native saving"
requires-python = ">=3.12,<3.13"
dependencies = ["Pillow>=11.1,<13", "tzdata>=2025.1"]

[project.optional-dependencies]
windows = [
  "playwright>=1.65,<2",
  "pywinauto>=0.6.9,<0.7; sys_platform == 'win32'",
  "psutil>=7,<8; sys_platform == 'win32'",
]

[project.scripts]
image-monitor = "image_monitor.__main__:main"

[tool.hatch.version]
path = "src/image_monitor/VERSION"
pattern = '^(?P<version>\S+)$'

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/image_monitor/VERSION" }]

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
